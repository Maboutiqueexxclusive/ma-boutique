<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma boutique exxclusive - Diana</title>
    <style>
        /* Styles de base */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            position: relative;
        }

        /* Bouton Retour à l'accueil (Haut à gauche, rectangulaire) */
        .btn-home {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-block;
            background-color: transparent;
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 8px 18px;
            border-radius: 0px; /* Bords rectangulaires */
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .btn-home:hover {
            background-color: #FFB6C1;
            color: #121212;
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        header h1 {
            color: #FFB6C1; /* Couleur Rose Clair */
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            font-size: 1.1em;
            margin: 0 0 20px 0;
        }

        /* Bouton de retour vers videopage1.html */
        .btn-back {
            display: inline-block;
            background-color: transparent;
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 8px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #FFB6C1;
            color: #121212;
        }

        /* Grille de la galerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        /* Style des cartes avec lien */
        .photo-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
            max-width: 240px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: #FFB6C1;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.2);
        }

        /* Conteneur de l'image */
        .photo-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo-card:hover .photo-wrapper img {
            transform: scale(1.05);
        }

        /* Zone de description sous l'image */
        .card-info {
            padding: 15px;
            text-align: left;
            background-color: #1e1e1e;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            color: #FFB6C1;
            font-size: 1.1em;
            margin: 0 0 6px 0;
            font-weight: 600;
        }

        .card-desc {
            color: #aaa;
            font-size: 0.88em;
            margin: 0;
            line-height: 1.4;
        }

    </style>
</head>
<body>

    <!-- Bouton Retour à l'accueil -->
    <a href="index.html" class="btn-home">← retour à l'accueil</a>

    <div id="content">
        <header>
            <h1>Photos perso</h1>
            <p>Galerie exclusive</p>
            <a href="shop05.html" class="btn-back">← Retour aux catégories</a>
        </header>

        <main class="gallery-grid">

            <!-- Photo 01 -->
            <a href="shop050201.html" class="photo-card">
                <div class="photo-wrapper">
                    <img src="image/shop050201bundle.png" alt="Lingerie">
                </div>
                <div class="card-info">
                    <h2 class="card-title">Photos Lot 01 ✨</h2>
                    <p class="card-desc">En lingerie à la maison.</p>
                </div>
            </a>

            <!-- Photo 02 -->
            <a href="shop050202.html" class="photo-card">
                <div class="photo-wrapper">
                    <img src="image/BundleBordmer.png" alt="Extérieur">
                </div>
                <div class="card-info">
                    <h2 class="card-title">Photos Lot 02 🌊</h2>
                    <p class="card-desc">Shooting en extérieur.</p>
                </div>
            </a>

            <!-- Photo 03 -->
            <a href="shop050203.html" class="photo-card">
                <div class="photo-wrapper">
                    <img src="image/Bundlesallebain.png" alt="Glamour">
                </div>
                <div class="card-info">
                    <h2 class="card-title">Photos Lot 03 📸</h2>
                    <p class="card-desc">Portraits glamour & éclairages artistiques.</p>
                </div>
            </a>
            

        </main>
    </div>

</body>
</html>
