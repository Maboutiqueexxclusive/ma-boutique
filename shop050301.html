<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Boutique Exxclusive - Diana</title>
    <style>
        /* Styles de base */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            position: relative;
        }

        /* Bouton Retour à l'accueil */
        .btn-home {
            position: absolute;
            top: 20px;
            left: 20px;
            display: inline-block;
            background-color: transparent;
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 8px 18px;
            border-radius: 0px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .btn-home:hover {
            background-color: #FFB6C1;
            color: #121212;
        }

        #content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        header h1 {
            color: #FFB6C1;
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            font-size: 1.1em;
            margin: 0 0 20px 0;
        }

        .btn-back {
            display: inline-block;
            background-color: transparent;
            color: #FFB6C1;
            border: 1px solid #FFB6C1;
            padding: 8px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #FFB6C1;
            color: #121212;
        }

        /* Grille de la galerie */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        /* Cartes de miniatures */
        .video-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: #FFB6C1;
        }

        /* Conteneur de l'image miniature avec icône Play au survol */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Icône "Play" superposée sur l'image */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #FFB6C1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        /* Triangle "Play" en CSS */
        .play-icon::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 12px solid #FFB6C1;
            margin-left: 3px;
        }

        .video-card:hover .play-icon {
            background-color: #FFB6C1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .video-card:hover .play-icon::after {
            border-left-color: #121212;
        }

        /* --- STYLES DE LA LIGHTBOX --- */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #lightbox-video {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            outline: none;
        }

        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #e0e0e0;
            font-size: 40px;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        #lightbox-close:hover {
            color: #FFB6C1;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-home">← retour à l'accueil</a>

    <div id="content">
        <header>
            <h1>Videos Lot 1 </h1>
            <p>Mes premières vidéos en ligne</p>
            <a href="shop0503.html" class="btn-back">← Retour aux vidéos</a>
        </header>

        <main class="gallery-grid">

            <div class="video-card">
                <div class="video-wrapper">
                    <img src="image/shop05030101.png" alt="Modèle 1" class="gallery-thumb" data-video="image/video01.mp4">
                    <div class="play-icon"></div>
                </div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <img src="image/shop05030102.png" alt="Modèle 2" class="gallery-thumb" data-video="image/video02.mp4">
                    <div class="play-icon"></div>
                </div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <img src="Bikiniplage03.png" alt="Modèle 3" class="gallery-thumb" data-video="video03.mp4">
                    <div class="play-icon"></div>
                </div>
            </div>

            <div class="video-card">
                <div class="video-wrapper">
                    <img src="Bikiniplage04.png" alt="Modèle 4" class="gallery-thumb" data-video="video04.mp4">
                    <div class="play-icon"></div>
                </div>
            </div>

        </main>
    </div>

    <div id="lightbox">
        <span id="lightbox-close">&times;</span>
        <video id="lightbox-video" controls autoplay></video>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxVideo = document.getElementById('lightbox-video');
        const lightboxClose = document.getElementById('lightbox-close');
        const videoCards = document.querySelectorAll('.video-card');

        // Fonction pour fermer la lightbox
        const closeLightbox = () => {
            lightbox.style.display = 'none';
            lightboxVideo.pause();
            lightboxVideo.src = ""; // Stoppe la vidéo et libère la mémoire
            document.body.style.overflow = 'auto';
        };

        // Ouverture de la lightbox au clic
        videoCards.forEach(card => {
            card.addEventListener('click', () => {
                const img = card.querySelector('.gallery-thumb');
                const videoSrc = img.getAttribute('data-video');
                
                lightboxVideo.src = videoSrc;
                lightbox.style.display = 'flex';
                lightboxVideo.play();
                document.body.style.overflow = 'hidden';
            });
        });

        lightboxClose.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxVideo) {
                closeLightbox();
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && lightbox.style.display === 'flex') {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
